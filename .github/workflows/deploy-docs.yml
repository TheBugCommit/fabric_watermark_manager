name: Publicar Documentació a GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositori
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar entorn Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instal·lar dependències de documentació
        run: pip install -r requirements-docs.txt

      - name: Publicar a GitHub Pages (gh-pages)
        run: mkdocs gh-deploy --force
