site_name: bfg_watermark
site_description: Llibreria de gestió i control de càrregues incrementals i watermarks per a Microsoft Fabric
site_author: Balfegó & Balfegó S.L.
site_url: https://thebugcommit.github.io/fabric_watermark_manager/
repo_url: https://github.com/TheBugCommit/fabric_watermark_manager
repo_name: TheBugCommit/fabric_watermark_manager

theme:
  name: material
  language: ca
  palette:
    # Mode Clar
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Canviar a mode fosc
    # Mode Fosc
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Canviar a mode clar
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

plugins:
  - search

nav:
  - Inici: index.md
  - Concepte i Taula de Control:
      - La Taula de Control: control-table.md
      - Arquitectura del Sistema: architecture.md
  - Referència de l'API:
      - WatermarkQuery: api/query.md
      - WatermarkConfig: api/config.md
      - watermark_session: api/session.md
      - WatermarkAdmin: api/admin.md
      - Constants: api/constants.md
      - Esquema i Validació: api/schema.md
  - Guies i Operacions:
      - Patrons de Codi: patterns.md
      - Operacions del Dia a Dia: operations.md
      - Escenaris Especials: special-scenarios.md
      - Configuració a Fabric: fabric-setup.md
